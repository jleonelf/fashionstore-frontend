<header class="app-header">
  <a routerLink="/" class="brand" aria-label="FashionStore inicio">
    <span class="brand-mark" aria-hidden="true"></span>
    <span>FashionStore</span>
  </a>

  <!-- NAV pública vs operativa — sin emojis, tipografía UI -->
  <nav class="nav-links" aria-label="Navegación principal">
    <!-- Siempre visible: descubrimiento -->
    <a routerLink="/catalogo" routerLinkActive="active" [routerLinkActiveOptions]="{exact:false}" class="nav-item">Catálogo</a>
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}" class="nav-item">Inicio</a>

    <!-- Operativo solo con sesión — RBAC Ciclo 1 -->
    <a routerLink="/sucursales" routerLinkActive="active" *ngIf="puedeVerSucursales()" class="nav-item">Sucursales</a>
    <a routerLink="/recepciones" routerLinkActive="active" *ngIf="puedeVerRecepciones()" class="nav-item">Recepciones</a>
    <a routerLink="/productos" routerLinkActive="active" *ngIf="puedeVerProductos()" class="nav-item">Productos</a>
    <a routerLink="/inventario" routerLinkActive="active" *ngIf="puedeVerInventario()" class="nav-item">Kardex</a>
    <a routerLink="/usuarios" routerLinkActive="active" *ngIf="esAdmin()" class="nav-item">Usuarios</a>
  </nav>

  <div class="header-right">
    <!-- Guest CTA -->
    <ng-container *ngIf="!usuarioActual">
      <a routerLink="/auth/login" class="btn-ghost sm">Ingresar</a>
      <a routerLink="/catalogo" class="btn-primary sm">Ver catálogo</a>
    </ng-container>

    <!-- Autenticado -->
    <div *ngIf="usuarioActual" class="user-pill">
      <div class="avatar-circle">{{ (usuarioActual.nombres || 'U')[0].toUpperCase() }}</div>
      <div class="user-details">
        <span class="user-fullname">{{ usuarioActual.nombre_completo }}</span>
        <span class="user-role">{{ usuarioActual.rol }}<span *ngIf="usuarioActual.sucursal_nombre"> — {{ usuarioActual.sucursal_nombre }}</span><span *ngIf="usuarioActual.cargo"> ({{ usuarioActual.cargo }})</span></span>
      </div>
      <button class="btn-logout" (click)="cerrarSesion()" title="Cerrar sesión">Salir</button>
    </div>
  </div>
</header>

<main class="main-content">
  <router-outlet></router-outlet>
</main>
