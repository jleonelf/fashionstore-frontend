<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <h2>Iniciar Sesión</h2>
      <p>Bienvenido de vuelta a FashionStore</p>
    </div>

    <div *ngIf="mensajeError" class="alert alert-danger">
      {{ mensajeError }}
    </div>

    <form (ngSubmit)="iniciarSesion()" class="auth-form">
      <div class="form-group">
        <label for="correo">Correo Electrónico</label>
        <input type="email" id="correo" [(ngModel)]="formulario.correo_electronico" name="correo" required placeholder="tu@correo.com" />
      </div>

      <div class="form-group">
        <label for="contrasenia">Contraseña</label>
        <input type="password" id="contrasenia" [(ngModel)]="formulario.contrasenia" name="contrasenia" required placeholder="••••••••" />
      </div>

      <button type="submit" class="btn-primary" [disabled]="cargando">
        <span *ngIf="!cargando">Ingresar</span>
        <span *ngIf="cargando">Verificando...</span>
      </button>

      <div class="auth-footer">
        <p>¿Aún no tienes cuenta? <a routerLink="/auth/registro">Regístrate aquí</a></p>
      </div>
    </form>
  </div>
</div>
