<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <h2>Crear Cuenta</h2>
      <p>Únete a FashionStore y disfruta de tu vestidor virtual y reservas en tienda</p>
    </div>

    <div *ngIf="mensajeError" class="alert alert-danger">
      {{ mensajeError }}
    </div>

    <div *ngIf="mensajeExito" class="alert alert-success">
      {{ mensajeExito }}
    </div>

    <form (ngSubmit)="registrarCliente()" class="auth-form">
      <div class="form-row">
        <div class="form-group">
          <label for="nombres">Nombres *</label>
          <input type="text" id="nombres" [(ngModel)]="formulario.nombres" name="nombres" required placeholder="Ej. Carlos" />
        </div>
        <div class="form-group">
          <label for="apellidos">Apellidos *</label>
          <input type="text" id="apellidos" [(ngModel)]="formulario.apellidos" name="apellidos" required placeholder="Ej. Santistevan" />
        </div>
      </div>

      <div class="form-group">
        <label for="correo">Correo Electrónico *</label>
        <input type="email" id="correo" [(ngModel)]="formulario.correo_electronico" name="correo" required placeholder="ejemplo@correo.com" />
      </div>

      <div class="form-group">
        <label for="contrasenia">Contraseña * (mínimo 6 caracteres)</label>
        <input type="password" id="contrasenia" [(ngModel)]="formulario.contrasenia" name="contrasenia" required placeholder="••••••••" />
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="telefono">Teléfono / Celular</label>
          <input type="tel" id="telefono" [(ngModel)]="formulario.telefono" name="telefono" placeholder="+591 70000000" />
        </div>
        <div class="form-group">
          <label for="fecha_nacimiento">Fecha de Nacimiento</label>
          <input type="date" id="fecha_nacimiento" [(ngModel)]="formulario.fecha_nacimiento" name="fecha_nacimiento" />
        </div>
      </div>

      <div class="form-group">
        <label for="direccion">Dirección de Referencia</label>
        <input type="text" id="direccion" [(ngModel)]="formulario.direccion_referencia" name="direccion" placeholder="Calle, Barrio, Ciudad" />
      </div>

      <button type="submit" class="btn-primary" [disabled]="cargando">
        <span *ngIf="!cargando">Registrarse</span>
        <span *ngIf="cargando">Procesando registro...</span>
      </button>

      <div class="auth-footer">
        <p>¿Ya tienes una cuenta? <a routerLink="/auth/login">Inicia sesión aquí</a></p>
      </div>
    </form>
  </div>
</div>
